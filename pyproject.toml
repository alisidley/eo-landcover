[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eolandcover"
version = "0.1.0"
description = "Land-cover classification and change detection from Sentinel-2 satellite imagery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexandra Sidley" }]
keywords = ["earth-observation", "remote-sensing", "sentinel-2", "land-cover", "change-detection"]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
torch = ["torch>=2.1", "torchgeo>=0.6"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint.per-file-ignores]
# Example scripts add src/ to sys.path before importing the package (E402).
"examples/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Find the package under src/ without needing an editable install (robust when
# the project path contains non-ASCII characters).
pythonpath = ["src"]
